{% extends 'base.html' %}

{% block content %}

<div class="text-center">

    <h2 class="text-danger">

        Delete Employee

    </h2>

    <p>

        Are you sure you want to delete this employee?

    </p>

    <form method="POST">

        {% csrf_token %}

        <button type="submit"
                class="btn btn-danger">

            Yes Delete

        </button>

        <a href="/"
           class="btn btn-secondary">

            Cancel

        </a>

    </form>

</div>

{% endblock %}
